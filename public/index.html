<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WoW Dashboard</title>
  <style>
    :root {
      --bg: #0e1116; --panel: #161b22; --panel-2: #1c232d; --border: #2a323d;
      --text: #e6edf3; --muted: #8b949e; --accent: #f8b700;
      --q-common: #ffffff; --q-uncommon: #1eff00; --q-rare: #0070dd; --q-epic: #a335ee; --q-legendary: #ff8000;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    a { color: inherit; }
    header.top { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
    header.top h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
    header.top .meta { color: var(--muted); font-size: 12px; display: flex; gap: 12px; align-items: center; }
    button { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
    header.top { gap: 16px; flex-wrap: wrap; }
    .picker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-right: auto; }
    input { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font: inherit; }
    .tabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 24px; border-bottom: 1px solid var(--border); }
    .tabs:empty { display: none; }
    .tab { display: flex; align-items: stretch; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); overflow: hidden; }
    .tab.active { border-color: var(--tab-color, var(--accent)); box-shadow: inset 0 -2px 0 var(--tab-color, var(--accent)); }
    .tab button { background: none; border: 0; border-radius: 0; color: var(--text); }
    .tab .pick { padding: 6px 4px 6px 12px; text-align: left; line-height: 1.2; }
    .tab .pick .realm { display: block; font-size: 11px; color: var(--muted); }
    .tab.active .pick .name { color: var(--tab-color, var(--text)); font-weight: 600; }
    .tab .x { padding: 0 10px; color: var(--muted); font-size: 16px; }
    .tab .x:hover { color: #f85149; }
    .tab button:focus-visible { outline: 1px solid var(--accent); outline-offset: -2px; }
    .picker form { display: flex; gap: 6px; flex-wrap: wrap; }
    .picker input { width: 140px; }
    .picker select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font: inherit; }
    .picker [hidden] { display: none; }
    .add-status { font-size: 12px; color: var(--muted); }
    .add-status.err { color: #f85149; }
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty strong { color: var(--text); }
    input:focus { border-color: var(--accent); outline: none; }
    button:hover { border-color: var(--accent); }
    main { padding: 24px; display: grid; gap: 24px; max-width: 1200px; margin: 0 auto; }

    .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .hero { display: flex; gap: 20px; padding: 20px; align-items: center; background: linear-gradient(90deg, color-mix(in srgb, var(--class) 22%, transparent), transparent 70%); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    .hero img.avatar { width: 84px; height: 84px; border-radius: 10px; border: 2px solid var(--class); object-fit: cover; }
    .hero h2 { margin: 0; font-size: 26px; color: var(--class); }
    .hero .sub { color: var(--muted); }
    .hero .kpis { margin-left: auto; display: flex; gap: 12px; flex-wrap: wrap; }
    .kpi { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; min-width: 110px; }
    .kpi .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
    .kpi .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }

    /* Cells keep their own height so a closed panel doesn't stretch to its open neighbour; outlines draw the dividers. */
    /* Dividers are outlines on the panels, so a part-filled last row leaves no grey gaps. */
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1px; background: var(--panel); border-top: 1px solid var(--border); }
    section { background: var(--panel); padding: 16px 20px; outline: 1px solid var(--border); }
    section h3 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; }
    section h3 a { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    td, th { padding: 4px 6px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 500; font-size: 12px; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    td a { text-decoration: none; } td a:hover { text-decoration: underline; }
    tr:last-child td { border-bottom: 0; }
    .timed { color: #3fb950; } .depleted { color: #f85149; }
    .bar { height: 6px; background: var(--panel-2); border-radius: 3px; overflow: hidden; margin-top: 3px; }
    .bar > span { display: block; height: 100%; }
    .notice { color: var(--muted); font-size: 13px; }
    .notice.err { color: #f85149; }
    .sources { display: flex; gap: 8px; padding: 10px 20px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); flex-wrap: wrap; }
    .pill { border: 1px solid var(--border); border-radius: 99px; padding: 2px 10px; }
    .pill.ok::before { content: "● "; color: #3fb950; }
    .pill.disabled::before { content: "● "; color: var(--muted); }
    .pill.sample::before { content: "● "; color: var(--accent); }
    .sample-tag { color: var(--accent); font-size: 12px; margin: -4px 0 10px; }
    .pill.error::before { content: "● "; color: #f85149; }
    .gear { font-size: 13px; table-layout: fixed; }
    .gear td { padding-top: 4px; padding-bottom: 4px; }
    .gear .slot { color: var(--muted); text-transform: capitalize; width: 76px; }
    .gear .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .gear .track { color: var(--muted); font-size: 12px; width: 92px; white-space: nowrap; }
    .gear .num { width: 34px; }
    .gear .mark { width: 50px; white-space: nowrap; }
    .gear tr[title] { cursor: help; }
    .up { color: #3fb950; }
    .drop { color: var(--accent); }
    .gear-legend { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
    .vault-row { display: grid; grid-template-columns: 96px repeat(3, 1fr); gap: 8px; margin-bottom: 8px; align-items: stretch; }
    .vault-label { font-size: 13px; align-self: center; }
    .vault-note { font-size: 11px; color: var(--muted); }
    .vault-note.err { color: #f85149; }
    .vault-row .sample-tag { margin: 0; font-size: 11px; }
    .vault-row .slot { border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; text-align: center; }
    .vault-row .slot.open { border-color: #3fb950; background: rgba(63, 185, 80, .08); }
    .vault-row .slot.locked { color: var(--muted); }
    .vault-row .reward { font-size: 15px; font-weight: 600; }
    .vault-row .need { font-size: 11px; color: var(--muted); }
    .muted { color: var(--muted); }
    .lockout-raid { margin-bottom: 14px; }
    .lockout-raid:last-child { margin-bottom: 0; }
    .lockout-name { font-size: 14px; margin-bottom: 4px; }
    .lockout { margin: 4px 0 8px; }
    .lockout-diff { font-size: 12px; color: var(--muted); }
    .lockout-diff strong { color: var(--text); }
    .lockout .chips { margin-top: 4px; gap: 4px; }
    .lockout-raid .notice { margin: 0; font-size: 12px; }
    .legacy { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
    .legacy .notice { margin: 0; font-size: 12px; }
    .legacy-exp { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 8px 0 2px; }
    .legacy-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
    .legacy-exp { margin-top: 10px; }
    .panel-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px; border-top: 1px solid var(--border); }
    .panel-bar button { font-size: 12px; padding: 4px 12px; border-radius: 99px; color: var(--muted); }
    .panel-bar button[aria-pressed="true"] { color: var(--text); border-color: var(--class, var(--accent)); background: color-mix(in srgb, var(--class, var(--accent)) 18%, var(--panel-2)); }
    .panel-hint { margin: 0; padding: 0 20px 14px; font-size: 12px; color: var(--muted); }
    .grid[hidden], .panel-hint[hidden], section[hidden] { display: none; }
    .spec-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin: -2px 0 10px; }
    .spec-tabs button { font-size: 12px; padding: 3px 10px; border-radius: 6px; color: var(--muted); }
    .spec-tabs button .muted { font-size: 11px; }
    .spec-tabs button[aria-pressed="true"] { color: var(--text); border-color: var(--class, var(--accent)); background: color-mix(in srgb, var(--class, var(--accent)) 18%, var(--panel-2)); }
    .sub-th { font-size: 11px; color: var(--muted); font-weight: 400; white-space: nowrap; }
    .gap { display: inline-block; min-width: 38px; text-align: right; font-size: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .chip { border: 1px solid var(--border); border-radius: 99px; padding: 2px 8px; font-size: 12px; color: var(--muted); }
    .chip.done { color: #3fb950; border-color: rgba(63, 185, 80, .5); }
    .notice.small { font-size: 11px; margin: 10px 0 0; }
    .loading { color: var(--muted); text-align: center; padding: 60px; }
    /* WoW: Forever overview: every section shown at once, the character render behind the header. */
    .hero.forever { position: relative; min-height: 190px; background-image: linear-gradient(90deg, color-mix(in srgb, var(--class) 22%, transparent), transparent 70%), var(--render, none); background-repeat: no-repeat; background-position: 0 0, right 56% top 22%; background-size: auto, auto 300%; }
    .hero.forever .kpis { position: relative; }
    .hero.forever .kpi { background: color-mix(in srgb, var(--panel-2) 85%, transparent); }
    section.wide { grid-column: 1 / -1; }
    section h3.follow { margin-top: 18px; }
    .rulesets { margin-left: auto; align-self: center; }
    .small { font-size: 11px; }
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 18px; font-size: 13px; }
    .stat-grid div { display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); padding: 3px 0; font-variant-numeric: tabular-nums; }
    .quest-list { margin: 0; padding-left: 18px; font-size: 13px; columns: 2; column-gap: 20px; }
    .quest-list li { break-inside: avoid; margin-bottom: 2px; }
    .meter { margin-bottom: 8px; font-size: 13px; }
    .meter-label { display: flex; justify-content: space-between; gap: 8px; }
    .meter-label .muted { font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    table.progress { margin-top: 10px; }
    .lifetime { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 4px 24px; font-size: 13px; }
    .lifetime .legacy-exp { margin-top: 6px; }
    .card > .panel-bar { border-top: 0; border-bottom: 1px solid var(--border); }
    .professions-page .grid { border-top: 1px solid var(--border); }
    section.profession h4 { margin: 16px 0 6px; font-size: 12px; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
    section.profession summary { list-style: none; cursor: pointer; }
    section.profession summary::-webkit-details-marker { display: none; }
    section.profession summary h3 { margin-bottom: 8px; }
    section.profession .prof-name::before { content: "▸"; display: inline-block; width: 1em; transition: transform .15s; }
    section.profession details[open] > summary .prof-name::before { transform: rotate(90deg); }
    section.profession summary:hover h3 { color: var(--text); }
    section.profession summary:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; border-radius: 4px; }
    section.profession summary .bar { margin: 0; }
    table.recipes { font-size: 13px; }
    table.recipes tr[title] { cursor: help; }
    .source-link { margin-left: 6px; font-size: 11px; color: var(--muted); text-decoration: none; white-space: nowrap; }
    .source-link:hover { color: var(--accent); text-decoration: underline; }
    .missing-controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--muted); }
    .missing-controls input[type="search"] { width: 220px; padding: 4px 8px; }
    .missing-controls select { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit; max-width: 100%; }
    .missing-controls input[type="checkbox"] { accent-color: var(--class, var(--accent)); }
    .scroll { max-height: 420px; overflow: auto; border: 1px solid var(--border); border-radius: 6px; }
    .scroll table th { position: sticky; top: 0; background: var(--panel-2); }
    table.missing tr[hidden] { display: none; }

    .quest-compare-bar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 20px; font-size: 13px; }
    .quest-compare-bar select { margin-left: 6px; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; font: inherit; }
    .quests-body .grid { border-top: 1px solid var(--border); }
    .quest-pair { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 1px; }
    table.quests { font-size: 13px; }
    .quest-type { font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; color: var(--muted); white-space: nowrap; }
    .quest-type.dungeon { color: #3fc7eb; border-color: rgba(63, 199, 235, .5); }
    .quest-type.elite { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
    .quest-type.raid { color: #ff8000; border-color: rgba(255, 128, 0, .5); }
    .quest-details { margin-top: 8px; }
    .quest-details summary { cursor: pointer; padding: 4px 0; }
    .quest-details table { margin-top: 6px; }

    /* Talents: modelled on the in-game talent frame (gold border when maxed, green while it can take points, grey when locked). */
    section.talents .spec-tabs { margin-bottom: 12px; }
    .talent-frame { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
    .talent-tree { position: relative; padding: 0 16px 16px; border: 1px solid #4a3a24; border-radius: 6px; overflow: hidden;
      background: linear-gradient(rgba(12, 9, 6, .86), rgba(12, 9, 6, .94)), var(--tree-art, none) center / cover, #120e0a; box-shadow: inset 0 0 30px #000; }
    .tt-head { display: flex; align-items: center; gap: 8px; margin: 0 -16px 14px; padding: 8px 12px; background: linear-gradient(#3a2c1b, #221a11); border-bottom: 1px solid #6b5326;
      font-family: "Friz Quadrata TT", "Friz Quadrata", Georgia, serif; color: #ffd100; text-shadow: 0 1px 2px #000; }
    .tt-head img { width: 22px; height: 22px; border-radius: 3px; border: 1px solid #000; }
    .tt-head b { margin-left: auto; font-weight: normal; color: #fff; }
    .tt-grid { position: relative; margin: 0 auto; }
    .tt-node { position: absolute; width: 38px; height: 38px; border-radius: 4px; outline: none; }
    .tt-node img { display: block; width: 100%; height: 100%; border-radius: 4px; border: 2px solid #1eff00; box-shadow: 0 0 0 1px #000; }
    .tt-node.maxed img { border-color: #ffd100; }
    .tt-node.locked img { border-color: #4a4a4a; filter: grayscale(1) brightness(.6); }
    .tt-node.open img { filter: brightness(.85); }
    .tt-rank { position: absolute; right: -8px; bottom: -7px; min-width: 22px; padding: 0 3px; border-radius: 3px; background: #000; border: 1px solid #333;
      font: bold 10px/14px system-ui, sans-serif; text-align: center; color: #1eff00; }
    .tt-node.maxed .tt-rank { color: #ffd100; }
    .tt-node.locked .tt-rank { color: #8a8a8a; }
    .tt-arrow { position: absolute; background: #5a5a5a; }
    .tt-arrow.lit { background: #ffd100; }
    .tt-arrow.down, .tt-arrow.flat, .tt-arrow.left, .tt-arrow.right { width: 6px; }
    .tt-arrow.flat, .tt-arrow.left, .tt-arrow.right { width: auto; height: 6px; }
    .tt-arrow.down::after { content: ""; position: absolute; left: -4px; bottom: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #5a5a5a; }
    .tt-arrow.lit.down::after { border-top-color: #ffd100; }
    .tt-arrow.right::after { content: ""; position: absolute; right: -7px; top: -4px; border: 7px solid transparent; border-right: 0; border-left-color: #5a5a5a; }
    .tt-arrow.left::after { content: ""; position: absolute; left: -7px; top: -4px; border: 7px solid transparent; border-left: 0; border-right-color: #5a5a5a; }
    .tt-arrow.lit.right::after { border-left-color: #ffd100; }
    .tt-arrow.lit.left::after { border-right-color: #ffd100; }
    /* The tooltip looks like the game's: dark blue panel, white name, yellow effect text, red requirements. */
    .tt-tip { display: none; position: absolute; z-index: 5; left: 46px; top: -4px; width: 260px; padding: 8px 10px; border-radius: 4px;
      background: rgba(4, 6, 22, .96); border: 1px solid #8a8f9c; box-shadow: 0 4px 14px rgba(0, 0, 0, .6); font-size: 12px; line-height: 1.4; color: #fff; pointer-events: none; }
    .tt-node:hover .tt-tip, .tt-node:focus .tt-tip { display: block; }
    .tt-node:hover, .tt-node:focus { z-index: 6; }
    .talent-tree:last-child .tt-node[style*="left:162px"] .tt-tip, .talent-tree:last-child .tt-node[style*="left:108px"] .tt-tip { left: auto; right: 46px; }
    .tt-tip-name { font-size: 14px; margin-bottom: 2px; }
    .tt-tip-desc { color: #ffd100; margin-top: 4px; }
    .tt-tip-next { margin-top: 8px; }
    .tt-tip-req { color: #ff2020; margin-top: 6px; }
    .talent-tree:has(.tt-node:hover), .talent-tree:has(.tt-node:focus) { overflow: visible; z-index: 2; }

    /* Legacy page: modelled on the in-game achievement frame (stone frame, gold trim, shield points, green status bars). */
    .legacy-page { padding: 16px; }
    .legacy-frame { --gold: #ffd100; --trim: #8a6a2c; --trim-hi: #c9a54a; font-family: "Friz Quadrata TT", "Friz Quadrata", Georgia, "Times New Roman", serif;
      background: radial-gradient(ellipse at top, #2b2219, #15110d 70%); border: 2px solid var(--trim); border-radius: 8px;
      box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px rgba(201, 165, 74, .35), 0 6px 24px rgba(0, 0, 0, .5); color: #f2e6c9; overflow: hidden; }
    .lf-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 18px; flex-wrap: wrap;
      background: linear-gradient(#3a2c1b, #221a11); border-bottom: 2px solid var(--trim); }
    .lf-title { color: var(--gold); font-size: 22px; letter-spacing: .04em; text-shadow: 0 2px 2px #000; }
    .lf-total { display: flex; align-items: center; gap: 10px; color: var(--gold); font-size: 15px; text-shadow: 0 1px 2px #000; }
    .lf-body { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: 480px; }
    .lf-cats { display: flex; flex-direction: column; gap: 3px; padding: 10px; background: rgba(0, 0, 0, .35); border-right: 1px solid var(--trim); }
    .lf-cats button { display: flex; justify-content: space-between; align-items: center; text-align: left; font: inherit; font-size: 14px;
      color: var(--gold); background: linear-gradient(#3b2e1e, #261d13); border: 1px solid #5a4526; border-radius: 3px; padding: 7px 10px; text-shadow: 0 1px 1px #000; }
    .lf-cats button small { color: #c8b78f; font-size: 11px; }
    .lf-cats button:hover { border-color: var(--trim-hi); }
    .lf-cats button[aria-pressed="true"] { background: linear-gradient(#6b5326, #3d2d15); border-color: var(--trim-hi); color: #fff3b0; box-shadow: inset 0 0 8px rgba(255, 209, 0, .25); }
    .lf-content { padding: 12px 16px 18px; max-height: 760px; overflow-y: auto; }
    .lf-heading { color: var(--gold); font-size: 15px; font-weight: normal; margin: 14px 0 8px; padding-bottom: 4px; border-bottom: 1px solid #5a4526; text-shadow: 0 1px 2px #000; }
    .lf-heading:first-child { margin-top: 2px; }
    .lf-note { font-family: system-ui, sans-serif; font-size: 12px; color: #b9a882; margin: 10px 0 0; }

    .ach-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 8px 10px; margin-bottom: 6px;
      background: linear-gradient(#211a13, #17120d); border: 1px solid #3f3120; border-radius: 4px; }
    .ach-row .ach-icon { width: 48px; height: 48px; border-radius: 4px; border: 2px solid #4a3a24; box-shadow: 0 0 0 1px #000; filter: grayscale(1) brightness(.55); background: #0d0a07; }
    .ach-row .ach-name { color: #c8b48a; font-size: 15px; }
    .ach-row .ach-desc { font-family: system-ui, sans-serif; font-size: 12px; color: #9d917a; margin-top: 2px; }
    .ach-row.done { background: linear-gradient(#4a3a1f, #2b2114); border-color: var(--trim-hi); box-shadow: inset 0 0 12px rgba(255, 209, 0, .12); }
    .ach-row.done .ach-icon { filter: none; border-color: var(--trim-hi); }
    .ach-row.done .ach-name { color: var(--gold); text-shadow: 0 1px 2px #000; }
    .ach-row.done .ach-desc { color: #e8dcc0; }
    .ach-side { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 64px; }
    .ach-date { font-family: system-ui, sans-serif; font-size: 11px; color: #e8dcc0; }
    .ach-shield { width: 30px; height: 34px; display: grid; place-items: center; font-weight: bold; font-size: 14px; color: #3a2a08;
      background: linear-gradient(#fff0a0, #d9a520 55%, #8a6114); clip-path: polygon(50% 0, 100% 14%, 92% 62%, 50% 100%, 8% 62%, 0 14%); }
    .ach-row:not(.done) .ach-shield { background: linear-gradient(#9a9a9a, #5f5f5f 55%, #3a3a3a); color: #1a1a1a; }
    .ach-shield.big { width: 38px; height: 44px; font-size: 18px; }

    .wow-bar { position: relative; height: 16px; margin-top: 6px; background: #0b0906; border: 1px solid #6b5326; border-radius: 3px; box-shadow: inset 0 1px 3px #000; overflow: hidden; }
    .wow-bar > span { position: absolute; inset: 0 auto 0 0; background: linear-gradient(#4fc13a, #237a19); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
    .wow-bar > em { position: relative; display: block; text-align: center; font: 11px/16px system-ui, sans-serif; font-style: normal; color: #fff; text-shadow: 0 1px 1px #000; }
    .ach-steps { list-style: none; margin: 6px 0 0; padding: 0; columns: 2; column-gap: 16px; font-family: system-ui, sans-serif; font-size: 12px; color: #8a806c; }
    .ach-steps li.done { color: #f2e6c9; }

    .reward-track { position: relative; padding-bottom: 22px; }
    .reward-track .wow-bar { height: 20px; }
    .reward-track .wow-bar > em { line-height: 20px; font-size: 12px; }
    .reward-marks { position: absolute; left: 0; right: 0; top: 24px; height: 18px; }
    .reward-mark { position: absolute; transform: translateX(-50%); font-family: system-ui, sans-serif; font-size: 11px; color: #8a806c; }
    .reward-mark::before { content: ""; position: absolute; left: 50%; top: -9px; width: 2px; height: 8px; background: #6b5326; }
    .reward-mark.got { color: var(--gold); }
    .reward-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 6px; }
    .reward { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border: 1px solid #3f3120; border-radius: 4px; background: rgba(0, 0, 0, .25); font-size: 13px; }
    .reward.got { border-color: var(--trim-hi); background: rgba(255, 209, 0, .08); }
    .reward-pts { color: var(--gold); font-size: 16px; min-width: 22px; }
    .reward-state { margin-left: auto; font-family: system-ui, sans-serif; font-size: 11px; color: #9d917a; white-space: nowrap; }
    .reward.got .reward-state { color: #4fc13a; }
    .lf-cat-bars { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 8px 18px; }
    .lf-cat-bar { display: block; text-align: left; background: none; border: 0; padding: 2px 0; color: #f2e6c9; font: inherit; font-size: 14px; }
    .lf-cat-bar:hover span { color: var(--gold); }
    @media (max-width: 720px) {
      .lf-body { grid-template-columns: 1fr; }
      .lf-cats { flex-direction: row; flex-wrap: wrap; border-right: 0; border-bottom: 1px solid var(--trim); }
      .ach-steps { columns: 1; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>⚔️ WoW Dashboard</h1>
    <div class="picker">
      <form id="add" aria-label="Add a character">
        <select id="add-game" aria-label="Game"><option value="retail">Retail</option><option value="forever">WoW: Forever</option></select>
        <select id="add-region" aria-label="Region"><option value="us">US</option><option value="eu">EU</option><option value="kr">KR</option><option value="tw">TW</option></select>
        <input id="add-realm" data-game="retail" list="add-realms" placeholder="Server" aria-label="Server" autocomplete="off" />
        <datalist id="add-realms"></datalist>
        <input id="add-name" placeholder="Name" aria-label="Character name" autocomplete="off" required />
        <input id="add-surname" data-game="forever" placeholder="Surname" aria-label="Surname" autocomplete="off" />
        <button>Add</button>
      </form>
      <span id="add-status" class="add-status" role="status"></span>
    </div>
    <div class="meta"><span id="updated"></span><button id="refresh">Refresh</button></div>
  </header>
  <nav id="tabs" class="tabs" aria-label="Characters"></nav>
  <main id="root"><div class="loading">Loading characters…</div></main>
  <script type="module" src="/app.js"></script>
</body>
</html>
